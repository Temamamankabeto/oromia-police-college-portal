name: OPC Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Package standalone release
        run: |
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          mkdir -p release/scripts release/database
          cp scripts/migrate.mjs release/scripts/
          cp -a database/migrations release/database/
          tar -czf opc-release.tar.gz -C release .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OPC_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPC_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          SSH_HOST: ${{ vars.OPC_SSH_HOST }}
          SSH_USER: ${{ vars.OPC_SSH_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes \
            opc-release.tar.gz \
            scripts/deploy-production.sh \
            "$SSH_USER@$SSH_HOST:~/.opc-deploy/"

      - name: Execute deployment
        env:
          SSH_HOST: ${{ vars.OPC_SSH_HOST }}
          SSH_USER: ${{ vars.OPC_SSH_USER }}
          APP_PATH: ${{ vars.OPC_APP_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash ~/.opc-deploy/deploy-production.sh '$APP_PATH' ~/.opc-deploy/opc-release.tar.gz"
